name: Build CarsonScreenSaver

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload screensaver
        uses: actions/upload-artifact@v4
        with:
          name: CarsonScreenSaver
          path: build/Release/CarsonScreenSaver.scr
