name: Build CarsonScreenSaver

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package screensavers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/CarsonScreenSaver.scr package/CarsonScreenSaver.scr
          Copy-Item build/Release/CarsonTuxScreenSaver.scr package/CarsonTuxScreenSaver.scr
          Copy-Item build/Release/CarsonWindows7ScreenSaver.scr package/CarsonWindows7ScreenSaver.scr
          Copy-Item Install-CarsonScreenSavers.ps1 package/Install-CarsonScreenSavers.ps1
          Copy-Item Install-CarsonScreenSavers.cmd package/Install-CarsonScreenSavers.cmd
          Copy-Item Install-CarsonScreenSavers-v2.ps1 package/Install-CarsonScreenSavers-v2.ps1
          Copy-Item Install-CarsonScreenSavers-v2.cmd package/Install-CarsonScreenSavers-v2.cmd

      - name: Create ZIP with separate screensavers
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath CarsonScreenSavers.zip -Force

      - name: Upload screensavers
        uses: actions/upload-artifact@v4
        with:
          name: CarsonScreenSavers
          path: CarsonScreenSavers.zip
